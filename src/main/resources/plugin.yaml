# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: property-fee
spec:
  enabled: true
  version: "1.2.0"
  requires: ">=2.23.0"
  author:
    name: Wenshan Internet Association
    website: https://aiedu.yn.cn
  logo: logo.png
  homepage: https://aiedu.yn.cn
  repo: https://github.com/chuanlbx-ui/halo-plugin-property-fee
  issues: https://github.com/chuanlbx-ui/halo-plugin-property-fee/issues
  displayName: "物业费收缴管理"
  description: "物业费收缴管理插件：业主登录后直接查看名下房屋各年度缴费情况并在线缴费（微信内直接拉起付款），房屋/业主/收费标准一张表批量导入，多商户号微信支付、线下到账确认、缴费报表与收缴率看板。适合物业公司/业委会线上收缴物业费。"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/chuanlbx-ui/halo-plugin-property-fee/blob/master/LICENSE"
